<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOKED Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #ededed;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .browser-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #0d0d0d;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 9999999;
    }

    .nav-buttons {
      display: flex;
      gap: 4px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid transparent;
      color: #888888;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: #141414;
      border-color: #262626;
      color: #ededed;
    }

    .btn-icon:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    /* Minimalist URL badge (Read-only, NO omnibox search) */
    .url-badge-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .url-badge {
      background: #141414;
      border: 1px solid #262626;
      padding: 4px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #737373;
      max-width: 480px;
    }

    .url-badge b {
      color: #d4d4d4;
      font-weight: 500;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-desktop {
      background: #ededed;
      border: 1px solid #ffffff;
      color: #050505;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-desktop:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .webview-wrapper {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      z-index: 1;
    }

    webview {
      width: 100%;
      height: 100%;
    }

    .toast-alert {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: #171717;
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="browser-toolbar">
    <div class="nav-buttons">
      <button class="btn-icon" id="btnBack" title="Назад">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="btn-icon" id="btnForward" title="Вперед">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="btn-icon" id="btnReload" title="Обновить">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      </button>
    </div>

    <div class="url-badge-container">
      <div class="url-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span><b id="currentDomain">Загрузка...</b></span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button class="btn-icon" id="btnZoomOut" title="Уменьшить">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"/></svg>
      </button>
      <button class="btn-icon" id="btnZoomIn" title="Увеличить">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
      </button>
      <button class="btn-desktop" id="btnCloseBrowser">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Рабочий стол
      </button>
    </div>
  </div>

  <div class="webview-wrapper">
    <webview id="wv" partition="persist:loked_session" allowpopups="false"></webview>
  </div>

  <div class="toast-alert" id="toastAlert">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <span id="toastMsg">Переход на внешний адрес заблокирован регламентом олимпиады</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const initialUrl = urlParams.get('initialUrl') || 'https://contest.yandex.ru';

    const wv = document.getElementById('wv');
    const currentDomainEl = document.getElementById('currentDomain');
    const btnBack = document.getElementById('btnBack');
    const btnForward = document.getElementById('btnForward');
    const btnReload = document.getElementById('btnReload');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnCloseBrowser = document.getElementById('btnCloseBrowser');
    const toastAlert = document.getElementById('toastAlert');
    const toastMsg = document.getElementById('toastMsg');

    let currentZoom = 1.0;

    function showBlockedToast(host) {
      toastMsg.textContent = `Внешний ресурс заблокирован (${host})`;
      toastAlert.style.display = 'flex';
      setTimeout(() => { toastAlert.style.display = 'none'; }, 3500);
    }

    wv.setAttribute('src', initialUrl);

    wv.addEventListener('dom-ready', () => {
      updateNavState();
      try {
        const parsed = new URL(wv.getURL());
        currentDomainEl.textContent = parsed.hostname;
      } catch (_) {}

      wv.executeJavaScript(`
        window.addEventListener('contextmenu', (e) => e.preventDefault(), true);
      `);
    });

    wv.addEventListener('did-navigate', (e) => {
      try {
        const parsed = new URL(e.url);
        currentDomainEl.textContent = parsed.hostname;
      } catch (_) {}
      updateNavState();
    });

    wv.addEventListener('will-navigate', (e) => {
      try {
        const parsed = new URL(e.url);
        const host = parsed.hostname.toLowerCase();
        const isAllowed = host.includes('yandex') || host.includes('codeforces') || host.includes('informatics') || host.includes('acmp') || host.includes('ejudge');
        if (!isAllowed) {
          e.preventDefault();
          showBlockedToast(host);
        }
      } catch (_) {}
    });

    wv.addEventListener('new-window', (e) => {
      e.preventDefault();
      try {
        const parsed = new URL(e.url);
        const host = parsed.hostname.toLowerCase();
        const isAllowed = host.includes('yandex') || host.includes('codeforces') || host.includes('informatics');
        if (isAllowed) {
          wv.loadURL(e.url);
        } else {
          showBlockedToast(host);
        }
      } catch (_) {}
    });

    function updateNavState() {
      btnBack.disabled = !wv.canGoBack();
      btnForward.disabled = !wv.canGoForward();
    }

    btnBack.addEventListener('click', () => { if (wv.canGoBack()) wv.goBack(); });
    btnForward.addEventListener('click', () => { if (wv.canGoForward()) wv.goForward(); });
    btnReload.addEventListener('click', () => { wv.reload(); });

    btnZoomIn.addEventListener('click', () => {
      currentZoom = Math.min(2.0, currentZoom + 0.1);
      wv.setZoomFactor(currentZoom);
    });

    btnZoomOut.addEventListener('click', () => {
      currentZoom = Math.max(0.6, currentZoom - 0.1);
      wv.setZoomFactor(currentZoom);
    });

    btnCloseBrowser.addEventListener('click', () => {
      if (window.lokedBrowser) {
        window.lokedBrowser.close();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.lokedBrowser) {
          window.lokedBrowser.close();
        }
      }
    });
  </script>
</body>
</html>

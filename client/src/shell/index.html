<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOKED</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="desktop-shell">
    <!-- Minimalist Header -->
    <header class="shell-header">
      <div class="brand">LOKED</div>
      
      <!-- Minimalist Exam Timer -->
      <div class="exam-timer" id="examTimerContainer">
        <span class="timer-dot" id="timerDot"></span>
        <span class="timer-digits" id="timerDigits">--:--:--</span>
        <span class="timer-label" id="timerLabel">Ожидание</span>
      </div>

      <div class="clock" id="systemClock">00:00:00</div>
    </header>

    <!-- Main Workspace: Clean Minimalist App Grid -->
    <main class="shell-main">
      <div class="apps-grid" id="shortcutsGrid">
        <!-- Injected dynamically based on actually installed apps -->
      </div>
    </main>

    <!-- Genuine macOS Dock at bottom -->
    <div class="dock-container">
      <div class="macos-dock" id="macosDock">
        <!-- Dock items with parabolic magnification -->
      </div>
    </div>
  </div>

  <!-- Minimalist Announcement Banner -->
  <div class="toast-banner" id="broadcastBanner">
    <div class="toast-content">
      <svg class="toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 11 18-5v12L3 14v-3z"/>
        <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
      </svg>
      <div class="toast-text" id="broadcastText">Объявление...</div>
    </div>
    <button class="toast-close" id="btnCloseBanner">&times;</button>
  </div>

  <!-- Locked Screen Minimal Overlay -->
  <div class="lock-overlay" id="screenLockerOverlay">
    <div class="lock-card">
      <svg class="lock-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <h2>Экран заблокирован</h2>
      <p id="lockerReason">Ожидайте указаний преподавателя.</p>
    </div>
  </div>

  <!-- Secret Master Unlock Dialog (Triggered ONLY by Ctrl+Alt+Shift+L) -->
  <div class="modal-overlay" id="unlockModal">
    <div class="modal-card">
      <div class="modal-title">Доступ преподавателя</div>
      <p class="modal-sub">Введите пароль для временного выхода из режима олимпиады:</p>
      <input type="password" id="unlockPasswordInput" class="modal-input" placeholder="Пароль" autofocus>
      <div class="modal-actions">
        <button class="btn-text" id="btnCancelUnlock">Отмена</button>
        <button class="btn-solid" id="btnConfirmUnlock">Разблокировать</button>
      </div>
      <div class="modal-error" id="unlockError" style="display:none;">Неверный пароль</div>
    </div>
  </div>

  <script src="shell.js"></script>
</body>
</html>
